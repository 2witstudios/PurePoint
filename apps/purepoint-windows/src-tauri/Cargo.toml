# Its own workspace (DEC-7): the Tauri dependency tree stays out of the root
# workspace's Cargo.lock and cargo-deny scan. The root Cargo.toml excludes it.
[workspace]

[package]
name = "purepoint-windows"
version = "0.1.0"
description = "PurePoint desktop app for Windows"
edition = "2024"
license = "MIT"
# Matches the root rust-toolchain.toml. Edition 2024 resolves dependencies
# MSRV-aware (resolver 3), so Cargo.lock picks crate versions that build on it.
rust-version = "1.89"
publish = false

[lib]
name = "purepoint_windows_lib"

[build-dependencies]
# Tauri 2.12 raised its MSRV to 1.90; stay on 2.11 until the root toolchain moves.
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
pu-core = { path = "../../../crates/pu-core" }
# Daemon endpoints: the private named pipe and its server check (WIN-5.3).
pu-transport = { path = "../../../crates/pu-transport" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `git_exec` and `fs_read` replies carry bytes as base64 (WIN-8.1).
base64 = "0.22"
# Resolves `git` and `gh` on PATH (WIN-8.1).
which = "8"
# Project watchers (WIN-5.6); the same major as pu-engine, pinned to the root lock.
notify = "8.2"
# Attach `client_id`s are `win:<uuid>` (WIN-5.4); the version Tauri already locks.
uuid = { version = "1", features = ["v4"] }
# Ctrl+click on a terminal link opens it outside the app (WIN-7.3).
tauri-plugin-opener = "~2.5"
# Point Guard runtime seal: SHA-256 of every bundled file (WIN-9.3); the version pu-core uses.
sha2 = "0.11"
# Point Guard chat (WIN-9.4): the bridge authenticates the v1 WebSocket by request headers a
# page cannot set, so the backend holds the socket. Plain `ws://` to loopback only: no TLS.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Same versions Tauri 2.11's WebView2 runtime links, so the COM types match.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# Daemon lifecycle: find, wait on and stop the running `pu-engine.exe` (WIN-5.3).
# Installer (WIN-10.1): the user PATH in HKCU\Environment and the WM_SETTINGCHANGE broadcast.
# Window chrome and placement (WIN-7.1): the caption sink, subclassing, regions and monitors.
# Point Guard (WIN-9.3): adapter addresses for the tailnet check, the Quit prompt.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The Point Guard seal hashes the whole ~230 MB runtime before each launch (WIN-9.3); unoptimized
# SHA-256 takes minutes, so debug builds and tests optimize it.
[profile.dev.package.sha2]
opt-level = 3
