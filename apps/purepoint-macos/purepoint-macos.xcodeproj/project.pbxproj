g/$CLI_BIN\" \"$OUT_DIR/$CLI_BIN\"\n    cp \"$RUST_TARGET_DIR/debug/$LOCK_BIN\" \"$OUT_DIR/$LOCK_BIN\"\n    # Also update ~/.cargo/bin and ~/.pu/bin so CLI usage stays in sync\n    install_atomic \"$RUST_TARGET_DIR/debug/$ENGINE_BIN\" \"$HOME/.cargo/bin/$ENGINE_BIN\" 2>/dev/null || true\n    mkdir -p \"$PU_BIN_DIR\"\n    install_atomic \"$RUST_TARGET_DIR/debug/$ENGINE_BIN\" \"$PU_BIN_DIR/$ENGINE_BIN\" 2>/dev/null || true\n    install_atomic \"$RUST_TARGET_DIR/debug/$CLI_BIN\" \"$PU_BIN_DIR/$CLI_BIN\" 2>/dev/null || true\nfi\n\n# Copy plugin directory into app bundle for CLIInstaller\nmkdir -p \"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources\"\nrm -rf \"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/pu-plugin\"\ncp -R \"$RUST_ROOT/pu-cli/assets/plugin\" \"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/pu-plugin\"\n\n# Package the supported Point Guard runtime before signing the app.\n# CI and owner builds may provide a prepackaged resource tree; never require\n# Node or npm on an end-user machine.\nPG_ARCH=arm64\nif [ \"$CONFIGURATION\" = \"Release\" ]; then PG_ARCH=universal; elif [ \"$CURRENT_ARCH\" = \"x86_64\" ]; then PG_ARCH=x64; fi\npython3 \"$SRCROOT/../purepoint-mobile/runtime/package-runtime.py\" --app \"$TARGET_BUILD_DIR/$WRAPPER_NAME\" --pu \"$OUT_DIR/$CLI_BIN\" --lock-helper \"$OUT_DIR/$LOCK_BIN\" --architecture \"$PG_ARCH\" --replace-build-artifact --build-root \"$TARGET_BUILD_DIR\"\n\npython3 \"$SRCROOT/../purepoint-mobile/runtime/sign-runtime.py\" --app \"$TARGET_BUILD_DIR/$WRAPPER_NAME\" --identity \"${EXPANDED_CODE_SIGN_IDENTITY:--}\"\n\n# Code sign the binaries with the app's identity\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" --options runtime \"$OUT_DIR/$ENGINE_BIN\"\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" --options runtime \"$OUT_DIR/$CLI_BIN\"\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" --options runtime \"$OUT_DIR/$LOCK_BIN\"\n";
