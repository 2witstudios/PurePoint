[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # unsafe-libyaml (via serde_yaml_ng) is archived; no fix exists. Unmaintained,
  # not a known vulnerability — drop once pu-core moves to a safe-Rust YAML parser.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, no safe upgrade; YAML parser migration pending" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
# notify (file watching for `subscribe_fs`) is public-domain dedicated.
exceptions = [
  { crate = "notify", allow = ["CC0-1.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Path dependencies inside the workspace carry no version and are allowed.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
