<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Name alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0E0E10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.alert{width:286px;background:#2A2A2F;border-radius:16px;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.alert h2{margin:18px 16px 4px;font-size:16px;font-weight:650}
.alert p{margin:0 16px;font-size:13px;line-height:1.4;color:#A1A1AA}
.field{margin:12px 16px 16px;display:block}
.field input{width:100%;box-sizing:border-box;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#18181B;color:#ECECEE;font:inherit;font-size:14px;padding:0 10px;outline:none}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid rgba(255,255,255,0.1)}
.btns button{height:46px;font-size:16px;color:#FF8A3D}
.btns button+button{border-left:1px solid rgba(255,255,255,0.1);font-weight:650}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121214; color: #ECECEE; font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">

  <div role="alertdialog" aria-label="Rename agent" class="alert">
    <h2>Rename agent</h2>
    <p>fix-auth on jono-mbp</p>
    <label class="field"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Agent name</span><input value="auth-pins"></label>
    <div class="btns"><button>Cancel</button><button>Rename</button></div>
  </div>

  <div role="alertdialog" aria-label="New worktree" class="alert">
    <h2>New worktree</h2>
    <p>In purepoint on jono-mbp</p>
    <label class="field"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Worktree name</span><input placeholder="Worktree name"></label>
    <div class="btns"><button>Cancel</button><button>Create</button></div>
  </div>

  <div role="alertdialog" aria-label="Mac name" class="alert">
    <h2>Mac name</h2>
    <p>Choose a name to recognize this Mac on your iPhone. Up to 60 characters.</p>
    <label class="field"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Name</span><input value="jono-mbp"></label>
    <div class="btns"><button>Cancel</button><button>Save</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
