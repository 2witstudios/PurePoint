<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pair with your Mac</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0E0E10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0E10; color: #ECECEE; font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif; font-size: 15px">
  <section aria-label="Pairing scanner sheet" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #050506; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; overflow: hidden">
    <header style="display: flex; align-items: center; height: 54px; padding: 0 8px; background: rgba(24,24,27,0.92)">
      <span style="width: 72px"></span>
      <h1 style="flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 600">Pair with your Mac</h1>
      <a href="Connections.dc.html" style="width: 72px; height: 44px; display: grid; place-items: center; color: #FF8A3D; font-weight: 600">Cancel</a>
    </header>
    <div aria-label="Camera preview" role="img" style="flex: 1; position: relative; display: grid; place-items: center; background: #0B0B0D">
      <div style="position: relative; width: 236px; height: 236px">
        <span style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-left: 4px solid #FF7A1A; border-top: 4px solid #FF7A1A; border-radius: 14px 0 0 0"></span>
        <span style="position: absolute; right: 0; top: 0; width: 40px; height: 40px; border-right: 4px solid #FF7A1A; border-top: 4px solid #FF7A1A; border-radius: 0 14px 0 0"></span>
        <span style="position: absolute; left: 0; bottom: 0; width: 40px; height: 40px; border-left: 4px solid #FF7A1A; border-bottom: 4px solid #FF7A1A; border-radius: 0 0 0 14px"></span>
        <span style="position: absolute; right: 0; bottom: 0; width: 40px; height: 40px; border-right: 4px solid #FF7A1A; border-bottom: 4px solid #FF7A1A; border-radius: 0 0 14px 0"></span>
      </div>
      <p style="position: absolute; left: 0; right: 0; bottom: 36px; margin: 0; text-align: center; font-size: 14px; color: #ECECEE">Point at the QR in Connect phone on your Mac</p>
    </div>
    <div role="status" style="padding: 16px 20px 40px; background: #222226; font-size: 14px; line-height: 1.45; color: #ECECEE">This code is expired or unsupported. Create a new Connect phone QR in PurePoint on your Mac.</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>

</html>
