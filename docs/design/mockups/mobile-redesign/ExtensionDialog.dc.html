<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Point Guard needs your input</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0E0E10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.sec{font-size:11px;font-weight:650;letter-spacing:.04em;color:#A1A1AA;padding:18px 16px 6px}
.grp{background:#222226;border-radius:12px;margin:0 12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-top:1px solid rgba(255,255,255,0.06);width:100%;box-sizing:border-box}
.row:first-child{border-top:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0E10; color: #ECECEE; font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif; font-size: 15px">
  <div style="position: absolute; left: 10px; right: 10px; top: 46px; height: 20px; border-radius: 12px 12px 0 0; background: #18181B; opacity: 0.55"></div>
  <section aria-label="Point Guard input sheet" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #18181B; border-radius: 12px 12px 0 0; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); margin: 6px auto 0"></div>
    <header style="display: flex; align-items: center; height: 48px; padding: 0 8px">
      <button style="width: 72px; height: 44px; text-align: center; color: #FF8A3D; font-weight: 600">Cancel</button>
      <h1 style="flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 600">Pick a base branch</h1>
      <span style="width: 72px"></span>
    </header>

    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 4px">
      <div style="width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; background: #1F1F23; border: 1px solid rgba(255,255,255,0.09)"><img src="/_blob/bd0b706e9a0d4e080c883a84280dd95d" alt="" style="width: 18px; height: 18px"></div>
      <p style="margin: 0; flex: 1; font-size: 14.5px; line-height: 1.45">Which branch should the new worktree start from?</p>
    </div>

    <div class="sec">CHOOSE ONE</div>
    <div class="grp">
      <button class="row"><span style="flex: 1">main</span></button>
      <button class="row"><span style="flex: 1">pu/ipad-app</span></button>
      <button class="row"><span style="flex: 1">pu/release-fixes</span></button>
    </div>

    <div class="sec">WHEN IT ASKS TO CONFIRM</div>
    <div class="grp">
      <button class="row" style="color: #FF8A3D; font-weight: 600">Allow</button>
      <button class="row" style="color: #A1A1AA">Decline</button>
    </div>

    <div class="sec">WHEN IT ASKS FOR TEXT</div>
    <div class="grp">
      <label class="row">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Your answer</span>
        <input placeholder="Your answer" style="flex: 1; background: none; border: 0; color: #ECECEE; font: inherit; outline: none">
      </label>
      <button class="row" style="color: #FF8A3D; font-weight: 600">Send answer</button>
    </div>
    <p style="margin: 10px 28px 0; font-size: 12.5px; line-height: 1.45; color: #A1A1AA">Only one kind shows at a time. Long text answers get a multi-line editor.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
