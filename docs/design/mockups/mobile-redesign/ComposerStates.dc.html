<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0E0E10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;border-radius:9px;background:#2E2E33;font-size:12.5px}
.chip b{font-size:10px;font-weight:650;color:#A1A1AA;letter-spacing:.03em}
p{margin:0}
@keyframes pg-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,.45)}50%{box-shadow:0 0 0 8px rgba(255,122,26,0)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #18181B; color: #ECECEE; font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <div style="height: 54px; flex-shrink: 0"></div>
  <header style="display: flex; align-items: center; height: 44px; padding: 0 4px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.06)">
    <span style="width: 44px; height: 44px; display: grid; place-items: center; color: #FF8A3D"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></span>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center"><span style="font-size: 15px; font-weight: 600">Point Guard</span><span style="display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #A1A1AA"><span style="width: 6px; height: 6px; border-radius: 3px; background: #0A84FF"></span>jono-mbp · Working</span></div>
    <span style="width: 88px"></span>
  </header>

  <main style="flex: 1; min-height: 0; position: relative; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end">
    <p style="line-height: 21px">I'm splitting the work into implementation and review now.</p>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #A1A1AA"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FF7A1A; animation: pg-pulse 1.2s ease-in-out infinite"></span>Running the play…</div>
    <button style="position: absolute; right: 14px; top: 12px; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: #2A2A2F; font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.4)"><svg class="ico" style="width: 14px; height: 14px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>Latest</button>
  </main>

  <footer style="flex-shrink: 0; padding: 8px 10px 30px; display: flex; flex-direction: column; gap: 8px">
    <details open style="background: #222226; border-radius: 14px; padding: 10px 14px">
      <summary style="font-size: 13px; font-weight: 600; color: #FFB340; cursor: pointer">Recover messages (1)</summary>
      <p style="margin-top: 8px; font-size: 14px; line-height: 1.4">Also check the Android bridge for the same pin bug.</p>
      <p style="margin-top: 3px; font-size: 12px; color: #A1A1AA">Delivery uncertain</p>
      <div style="display: flex; gap: 18px; height: 40px; align-items: center; font-size: 13.5px; font-weight: 600"><button style="color: #FF8A3D">Restore to draft</button><span style="flex: 1"></span><button style="color: #A1A1AA">Dismiss</button></div>
    </details>
    <div style="font-size: 12px; color: #A1A1AA; padding: 0 8px">1 message queued</div>
    <div style="background: #222226; border: 1px solid rgba(255,255,255,0.09); border-radius: 20px; padding: 10px 10px 8px 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 6px">
        <span class="chip"><b>IMAGE</b>Photo.jpg<button aria-label="Remove Photo.jpg" style="width: 26px; height: 26px; display: grid; place-items: center; color: #A1A1AA"><svg class="ico" style="width: 12px; height: 12px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
        <span class="chip"><b>TEXT</b>notes.md<button aria-label="Remove notes.md" style="width: 26px; height: 26px; display: grid; place-items: center; color: #A1A1AA"><svg class="ico" style="width: 12px; height: 12px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
      </div>
      <p style="font-size: 15px; line-height: 1.45; padding: 0 4px">Use the screenshot for the error copy</p>
      <div style="display: flex; align-items: center; gap: 6px">
        <button aria-label="Add attachment" style="width: 40px; height: 40px; border-radius: 10px; color: #A1A1AA; display: grid; place-items: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <span style="flex: 1"></span>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,122,26,0.16); color: #FF8A3D; font-size: 14px; font-weight: 650">Steer</button>
        <button aria-label="Stop Point Guard" style="width: 40px; height: 40px; border-radius: 20px; background: #ECECEE; color: #18181B; display: grid; place-items: center"><span style="width: 12px; height: 12px; border-radius: 2px; background: #18181B"></span></button>
      </div>
    </div>
  </footer>

  <div role="menu" aria-label="Steer" style="position: absolute; right: 60px; bottom: 140px; width: 190px; background: #2A2A2F; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.55)">
    <button role="menuitem" style="display: block; width: 100%; height: 44px; padding: 0 16px; text-align: left; font-size: 16px">Steer now</button>
    <div style="height: 1px; background: rgba(255,255,255,0.08)"></div>
    <button role="menuitem" style="display: block; width: 100%; height: 44px; padding: 0 16px; text-align: left; font-size: 16px">After reply</button>
  </div>
  <div role="menu" aria-label="Add attachment" style="position: absolute; left: 22px; bottom: 140px; width: 170px; background: #2A2A2F; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.55)">
    <button role="menuitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 16px; font-size: 16px"><span style="flex: 1; text-align: left">Photos</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-5-9 8"/></svg></button>
    <div style="height: 1px; background: rgba(255,255,255,0.08)"></div>
    <button role="menuitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 16px; font-size: 16px"><span style="flex: 1; text-align: left">Files</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
