# Throwaway spike (WIN-1.1): proves ConPTY hosting from Rust. Not a workspace
# member; the empty [workspace] table keeps the root workspace from adopting it.
[package]
name = "conpty-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
vt100 = { path = "../../vendor/vt100-0.16.2" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[patch.crates-io]
vte = { path = "../../vendor/vte-0.15.0" }
