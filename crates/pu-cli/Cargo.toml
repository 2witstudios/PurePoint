[package]
name = "pu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pu-core = { path = "../pu-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
shell-words = "1"
which = "8"
libc = "0.2"

[[bin]]
name = "pu"
path = "src/main.rs"

[[bin]]
name = "pu-point-guard-lock"
path = "src/bin/point_guard_lock.rs"

[dev-dependencies]
pu-engine = { path = "../pu-engine" }
tempfile = "3"
