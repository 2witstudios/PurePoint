version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-deps:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # The Point Guard bridge and its bundled npm runtime.
  - package-ecosystem: npm
    directory: /apps/purepoint-mobile
    schedule:
      interval: weekly
    groups:
      npm-deps:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The ref is the Rust version to install, not the action's version;
      # Dependabot bumped it to a nonexistent toolchain (1.120.0).
      - dependency-name: dtolnay/rust-toolchain
