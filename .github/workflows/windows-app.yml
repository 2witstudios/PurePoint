name: Windows App

on:
  push:
    branches: [main]
    paths: &windows-app-paths
      - "apps/purepoint-windows/**"
      - "crates/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/windows-app.yml"
  pull_request:
    paths: *windows-app-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/purepoint-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/purepoint-windows/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/purepoint-windows/src-tauri -> target
          key: windows-app
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Rust format, lint and test
        working-directory: apps/purepoint-windows/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets
          cargo test --locked --all-targets
      - run: npm run tauri -- build --debug --no-bundle
