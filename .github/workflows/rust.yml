name: Rust CI

on:
  push:
    branches: [main]
    paths: &rust-paths
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".github/workflows/rust.yml"
      - "scripts/windows-smoke.ps1"
      - "docs/reference/cli-commands-map.csv"
  pull_request:
    paths: *rust-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - name: Isolate Rust output
        run: printf 'CARGO_TARGET_DIR=%s/rust-ci-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - name: Isolate Rust output
        run: printf 'CARGO_TARGET_DIR=%s/rust-ci-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-targets

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Every workspace crate passes natively on Windows (WIN-3.12, WIN-4.5).
      WINDOWS_CRATES: --workspace
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
          components: clippy
      - name: Isolate Rust output
        run: printf 'CARGO_TARGET_DIR=%s/rust-ci-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      - run: cargo clippy --all-targets $WINDOWS_CRATES
      - run: cargo test --all-targets $WINDOWS_CRATES
      - run: cargo build -p pu-cli -p pu-engine
      # pu refuses a pu-engine other users can write, and the runner's temp folders grant that,
      # so stage the binaries as an install would: in a folder only this user, SYSTEM and
      # Administrators can write.
      - name: Stage pu and pu-engine in a private folder
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'pu-ci-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          & "$env:SystemRoot\System32\icacls.exe" $bin /inheritance:r /grant:r "${env:USERDOMAIN}\${env:USERNAME}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
          if ($LASTEXITCODE) { throw 'icacls failed' }
          Copy-Item "$env:CARGO_TARGET_DIR/debug/pu.exe", "$env:CARGO_TARGET_DIR/debug/pu-engine.exe" -Destination $bin
          "PU_CI_BIN=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # End-to-end CLI run against a real daemon under a temp HOME (WIN-4.6).
      - name: CLI smoke run
        shell: pwsh
        run: >-
          ./scripts/windows-smoke.ps1 -Agent terminal
          -PuPath "$env:PU_CI_BIN/pu.exe"
          -EnginePath "$env:PU_CI_BIN/pu-engine.exe"

  linux-musl:
    name: Static Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Isolate Rust output
        run: printf 'CARGO_TARGET_DIR=%s/rust-ci-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl
      # Release ships these as static musl binaries for Linux servers.
      - run: cargo build --locked --target x86_64-unknown-linux-musl -p pu-cli -p pu-engine

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install the same audit version from verified release binaries, avoiding
      # Docker Hub's unauthenticated image-pull limit.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features check advisories licenses bans sources
