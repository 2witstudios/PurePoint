name: Release

# Build jobs hold no secrets and only read the repository. Signing and
# notarization run in their own job, in the protected `release` environment,
# on the unsigned app the build job produced. Only the final publish job can
# write to the repository, and it runs no build code.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      raw: ${{ steps.version.outputs.raw }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Extract version from tag
        id: version
        # The tag reaches the shell only through the environment, and must be a
        # plain X.Y.Z: later jobs interpolate the extracted version.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag must be vX.Y.Z, got: $RELEASE_TAG"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          BUILD_NUMBER=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "raw=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version: ${TAG} (build_number=${BUILD_NUMBER})"

  # Compiles every third-party dependency (crates, Swift packages, npm runtime),
  # so it gets no secrets, no signing identity and no write token. Release
  # builds start from a clean cache.
  build-macos:
    name: Build macOS app (unsigned)
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.raw }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Checkout pinned local tree-sitter packages
        run: bash .github/scripts/checkout-tree-sitter.sh

      - name: Prepare local packages for Xcode
        run: |
          for pkg in apps/purepoint-macos/LocalPackages/tree-sitter-*; do
            lib=$(sed -n 's/.*name: "\(TreeSitter[^"]*\)".*/\1/p' "$pkg/Package.swift" | head -1)
            mkdir -p "$pkg/src/include"
            find "$pkg/bindings/swift" -name '*.h' -exec cp {} "$pkg/src/include/" \;
            cp -r "$pkg/queries" "$pkg/src/queries" 2>/dev/null || true
            find "$pkg/src" -type f -not -name '*.c' -not -name '*.h' -not -name '*.scm' -delete
            find "$pkg/src" -type d -empty -delete 2>/dev/null || true
            cat > "$pkg/Package.swift" << PKGEOF
          // swift-tools-version:5.3
          import PackageDescription
          let package = Package(
              name: "$lib",
              products: [.library(name: "$lib", targets: ["$lib"])],
              targets: [
                  .target(
                      name: "$lib",
                      path: "src",
                      resources: [.copy("queries")],
                      publicHeadersPath: "include",
                      cSettings: [.headerSearchPath(".")]
                  ),
              ],
              cLanguageStandard: .c11
          )
          PKGEOF
          done

      # Ad-hoc signed only; the sign-macos job re-signs every nested binary
      # with the Developer ID identity.
      - name: Archive
        run: |
          xcodebuild archive \
            -project apps/purepoint-macos/purepoint-macos.xcodeproj \
            -scheme purepoint-macos \
            -configuration Release \
            -archivePath build/PurePoint.xcarchive \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # tar keeps the bundle's symlinks and modes, which artifact upload drops.
      - name: Package unsigned app
        run: |
          tar -C build/PurePoint.xcarchive/Products/Applications \
            -cf build/PurePoint-unsigned.tar PurePoint.app

      - name: Upload unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app-unsigned
          path: build/PurePoint-unsigned.tar
          if-no-files-found: error
          retention-days: 14

  # Holds the Developer ID identity, the notarization credentials and the
  # Sparkle update key. Runs only Apple's tools, this repository's signing
  # scripts, and Sparkle and create-dmg releases verified by SHA-256.
  sign-macos:
    name: Sign and notarize macOS app
    needs: [version, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      ed_signature: ${{ steps.sparkle_sign.outputs.ed_signature }}
      length: ${{ steps.sparkle_sign.outputs.length }}
    env:
      VERSION: ${{ needs.version.outputs.raw }}
      APP_PATH: build/export/PurePoint.app
      DMG_PATH: build/PurePoint-${{ needs.version.outputs.raw }}.dmg
      # Must match the Sparkle version the app links (Package.resolved).
      SPARKLE_VERSION: 2.9.0
      SPARKLE_SHA256: 01e0f0ebf6614061ea816d414de50f937d64ffa6822ad572243031ca3676fe19
      # create-dmg v1.3.0, fetched by commit so the archive can't move with the tag.
      CREATE_DMG_COMMIT: a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f
      CREATE_DMG_SHA256: 36577b966f16c12dd78d5bb5107c2ae3d069b044226b6ebbffa6a434ce142d0a
    steps:
      - name: Set signing paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "CERT_PATH=$RUNNER_TEMP/certificate.p12" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download unsigned app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-app-unsigned
          path: build

      - name: Unpack unsigned app
        run: |
          mkdir -p build/export
          tar -xf build/PurePoint-unsigned.tar -C build/export
          rm build/PurePoint-unsigned.tar
          # Extended attributes picked up in transit fail strict verification.
          xattr -cr "$APP_PATH"

      - name: Install Sparkle tools
        run: |
          ARCHIVE="$RUNNER_TEMP/sparkle.tar.xz"
          curl -fsSL --proto '=https' \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$ARCHIVE"
          echo "${SPARKLE_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$ARCHIVE" -C "$RUNNER_TEMP/sparkle"

      - name: Install create-dmg
        run: |
          ARCHIVE="$RUNNER_TEMP/create-dmg.tar.gz"
          curl -fsSL --proto '=https' \
            "https://github.com/create-dmg/create-dmg/archive/${CREATE_DMG_COMMIT}.tar.gz" \
            -o "$ARCHIVE"
          echo "${CREATE_DMG_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"

      # The key is not extractable (-x) and only codesign may use it (-T). The
      # keychain locks itself after 15 idle minutes; signing steps unlock it.
      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -x -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Sign app
        run: |
          bash .github/scripts/sign-macos-app.sh "$APP_PATH" "Developer ID Application"
          security lock-keychain "$KEYCHAIN_PATH"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ZIP_PATH="$RUNNER_TEMP/PurePoint-notarize.zip"

          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        run: |
          "$RUNNER_TEMP/create-dmg-${CREATE_DMG_COMMIT}/create-dmg" \
            --volname "PurePoint" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "PurePoint.app" 150 190 \
            --app-drop-link 450 190 \
            --hide-extension "PurePoint.app" \
            "$DMG_PATH" \
            "$APP_PATH" \
            || true

          ls -la "$DMG_PATH"

      # Last use of the signing identity: the keychain is deleted right after.
      - name: Sign DMG
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          codesign --force --sign "Developer ID Application" \
            --options runtime "$DMG_PATH"
          security delete-keychain "$KEYCHAIN_PATH"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Sign DMG with Sparkle Ed25519
        id: sparkle_sign
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          SIGN_OUTPUT=$(printf '%s\n' "$SPARKLE_ED25519_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" "$DMG_PATH" --ed-key-file -)
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          if [ -z "$ED_SIGNATURE" ] || [ -z "$LENGTH" ]; then
            echo "::error::sign_update did not report an edSignature and length"
            exit 1
          fi
          echo "ed_signature=${ED_SIGNATURE}" >> "$GITHUB_OUTPUT"
          echo "length=${LENGTH}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERT_PATH"

  # Static pu + pu-engine for Linux servers (installed by scripts/install.sh),
  # plus the pu-point-guard-lock helper the phone access payload ships.
  # Built natively per arch against musl, so no glibc version floor applies.
  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins 1.89 for every in-repo cargo call, so the
      # targets installed above land on 1.94.0 while the build runs on the
      # pinned toolchain. Add the target there too, as the macOS build phase
      # does for its Apple targets.
      - name: Add target to the pinned toolchain
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p pu-cli -p pu-engine
        env:
          TARGET: ${{ matrix.target }}

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.version.outputs.raw }}
          TARGET: ${{ matrix.target }}
        run: |
          NAME="purepoint-${VERSION}-${TARGET}"
          mkdir -p "dist/${NAME}"
          cp "target/${TARGET}/release/pu" "target/${TARGET}/release/pu-engine" \
            "target/${TARGET}/release/pu-point-guard-lock" "dist/${NAME}/"
          cp LICENSE* README.md "dist/${NAME}/" 2>/dev/null || true
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  # Opt-in phone access for Linux hosts (LPH-002): the Point Guard bridge
  # payload with the official glibc Node, built natively per arch from the
  # exact musl pu and lock helper the `linux` job produced. Before upload it
  # is installed by scripts/install.sh into a throwaway HOME and launched
  # under an empty environment, both relocated and in place.
  linux-phone:
    name: Linux phone access payload (${{ matrix.arch }})
    needs: [version, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            node_target: linux-x64
            pu_target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: aarch64
            node_target: linux-arm64
            pu_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.raw }}
      ARCH: ${{ matrix.arch }}
      NODE_TARGET: ${{ matrix.node_target }}
      PU_TARGET: ${{ matrix.pu_target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm only stages the lockfile's packages (scripts off); the payload
      # ships its own pinned Node, never this one.
      - name: Install Node for npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      - name: Download Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purepoint-${{ needs.version.outputs.raw }}-${{ matrix.pu_target }}
          path: ${{ runner.temp }}/pu-build

      - name: Verify and unpack Linux build
        run: |
          NAME="purepoint-${VERSION}-${PU_TARGET}"
          (cd "$RUNNER_TEMP/pu-build" && sha256sum -c "${NAME}.tar.gz.sha256")
          mkdir -p "$RUNNER_TEMP/pu-unpacked"
          tar -xzf "$RUNNER_TEMP/pu-build/${NAME}.tar.gz" -C "$RUNNER_TEMP/pu-unpacked"
          echo "PU_DIR=$RUNNER_TEMP/pu-unpacked/${NAME}" >> "$GITHUB_ENV"

      # The payload records the pu crate version, which `pu phone` compares
      # with its own; the asset name uses the release version.
      - name: Package phone access payload
        run: |
          PU_CRATE_VERSION=$(python3 apps/purepoint-mobile/runtime/package-runtime.py --print-pu-version)
          if [ "$PU_CRATE_VERSION" != "$VERSION" ]; then
            echo "::warning::release v${VERSION} builds pu ${PU_CRATE_VERSION}; the payload installs to ~/.pu/pointguard/${PU_CRATE_VERSION}"
          fi
          python3 apps/purepoint-mobile/runtime/package-runtime.py --layout dir \
            --target "$NODE_TARGET" \
            --out "$RUNNER_TEMP/phone" \
            --lock-helper "$PU_DIR/pu-point-guard-lock" \
            --pu-version "$PU_CRATE_VERSION" \
            --release-version "$VERSION" \
            --cache "$RUNNER_TEMP/node-cache"
          echo "PU_CRATE_VERSION=$PU_CRATE_VERSION" >> "$GITHUB_ENV"
          echo "PHONE_NAME=purepoint-pointguard-${VERSION}-${ARCH}-linux-gnu" >> "$GITHUB_ENV"

      - name: Launch relocated payload in a clean environment
        run: |
          "$RUNNER_TEMP/phone/$PHONE_NAME/bin/node" apps/purepoint-mobile/runtime/prove-linux-runtime.mjs \
            "$RUNNER_TEMP/phone/$PHONE_NAME" "$PU_DIR/pu"

      - name: Install with install.sh into a throwaway HOME and launch in place
        run: |
          SMOKE_HOME="$RUNNER_TEMP/smoke-home"
          mkdir -m 700 "$SMOKE_HOME"
          env -i HOME="$SMOKE_HOME" PATH=/usr/bin:/bin \
            PU_ARCHIVE="$RUNNER_TEMP/pu-build/purepoint-${VERSION}-${PU_TARGET}.tar.gz" \
            PU_PHONE_ARCHIVE="$RUNNER_TEMP/phone/${PHONE_NAME}.tar.gz" \
            sh scripts/install.sh
          INSTALLED="$SMOKE_HOME/.pu/pointguard/$PU_CRATE_VERSION"
          "$INSTALLED/bin/node" apps/purepoint-mobile/runtime/prove-linux-runtime.mjs \
            "$INSTALLED" "$SMOKE_HOME/.pu/bin/pu" --in-place

      - name: Upload phone access payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: purepoint-pointguard-${{ needs.version.outputs.raw }}-${{ matrix.arch }}-linux-gnu
          path: |
            ${{ runner.temp }}/phone/purepoint-pointguard-${{ needs.version.outputs.raw }}-${{ matrix.arch }}-linux-gnu.tar.gz
            ${{ runner.temp }}/phone/purepoint-pointguard-${{ needs.version.outputs.raw }}-${{ matrix.arch }}-linux-gnu.tar.gz.sha256
          if-no-files-found: error

  # Signs build provenance for every Linux asset (the pu tarballs and the
  # phone access payloads), which install.sh checks with
  # `gh attestation verify`. The OIDC token lives only here: this job checks
  # out no code and runs no build code, only checksum checks and GitHub's
  # attestation action.
  attest:
    name: Attest Linux build provenance
    needs: [version, linux, linux-phone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: purepoint-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          cd dist
          COUNT=0
          for SUM in *.tar.gz.sha256; do
            sha256sum -c "$SUM"
            COUNT=$((COUNT + 1))
          done
          # Two pu tarballs and two phone payloads, nothing else.
          [ "$COUNT" -eq 4 ] && [ "$(find . -mindepth 1 | wc -l)" -eq 8 ]

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  # The only job with a write token. It runs no build code: it creates the
  # release with every asset in one step, then points the update feed at it.
  # Versioned assets are never replaced; a re-run against an existing release
  # only checks that the release already has them.
  publish:
    name: Publish release
    needs: [version, sign-macos, linux, linux-phone, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.raw }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      ED_SIGNATURE: ${{ needs.sign-macos.outputs.ed_signature }}
      LENGTH: ${{ needs.sign-macos.outputs.length }}
    steps:
      - name: Download Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: purepoint-*
          path: dist
          merge-multiple: true

      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: dist

      # A re-run of every job re-signs and re-notarizes the DMG, which changes
      # its bytes. The appcast must never carry a signature for a DMG other
      # than the published one, so an existing release must match exactly.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "PurePoint $TAG" \
              --generate-notes
            exit 0
          fi
          echo "::notice::$TAG already exists; its assets are left unchanged"
          PUBLISHED=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | "\(.digest) \(.name)"')
          for FILE in dist/*; do
            EXPECTED="sha256:$(sha256sum "$FILE" | cut -d' ' -f1) $(basename "$FILE")"
            if ! grep -qxF "$EXPECTED" <<< "$PUBLISHED"; then
              echo "::error::$TAG assets already published with different content ($(basename "$FILE")); delete the release, or use Re-run failed jobs instead of re-running all jobs"
              exit 1
            fi
          done

      # The `appcast` release is the moving update feed, so its appcast.xml is
      # the one asset that is replaced on every release.
      - name: Generate and upload appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_URL="https://github.com/2witstudios/purepoint/releases/download/v${VERSION}/PurePoint-${VERSION}.dmg"
          PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S %z')"

          mkdir -p build
          cat > build/appcast.xml << APPCAST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>PurePoint</title>
              <item>
                <title>PurePoint v${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <enclosure url="${DMG_URL}" sparkle:edSignature="${ED_SIGNATURE}" length="${LENGTH}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          APPCAST_EOF

