name: Release

# Build jobs hold no secrets and only read the repository. Signing and
# notarization run in their own jobs, in the protected `release` environment,
# on the builds the build jobs produced. Build provenance and SBOM
# attestations come from a job that runs no repository code. Only the final
# publish job can write to the repository, and it runs no build code either.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      raw: ${{ steps.version.outputs.raw }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Extract version from tag
        id: version
        # The tag reaches the shell only through the environment, and must be a
        # plain X.Y.Z: later jobs interpolate the extracted version.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag must be vX.Y.Z, got: $RELEASE_TAG"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          BUILD_NUMBER=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "raw=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version: ${TAG} (build_number=${BUILD_NUMBER})"

  # Compiles every third-party dependency (crates, Swift packages, npm runtime),
  # so it gets no secrets, no signing identity and no write token. Release
  # builds start from a clean cache.
  build-macos:
    name: Build macOS app (unsigned)
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.raw }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Checkout pinned local tree-sitter packages
        run: bash .github/scripts/checkout-tree-sitter.sh

      - name: Prepare local packages for Xcode
        run: |
          for pkg in apps/purepoint-macos/LocalPackages/tree-sitter-*; do
            lib=$(sed -n 's/.*name: "\(TreeSitter[^"]*\)".*/\1/p' "$pkg/Package.swift" | head -1)
            mkdir -p "$pkg/src/include"
            find "$pkg/bindings/swift" -name '*.h' -exec cp {} "$pkg/src/include/" \;
            cp -r "$pkg/queries" "$pkg/src/queries" 2>/dev/null || true
            find "$pkg/src" -type f -not -name '*.c' -not -name '*.h' -not -name '*.scm' -delete
            find "$pkg/src" -type d -empty -delete 2>/dev/null || true
            cat > "$pkg/Package.swift" << PKGEOF
          // swift-tools-version:5.3
          import PackageDescription
          let package = Package(
              name: "$lib",
              products: [.library(name: "$lib", targets: ["$lib"])],
              targets: [
                  .target(
                      name: "$lib",
                      path: "src",
                      resources: [.copy("queries")],
                      publicHeadersPath: "include",
                      cSettings: [.headerSearchPath(".")]
                  ),
              ],
              cLanguageStandard: .c11
          )
          PKGEOF
          done

      # The build phase packages the Point Guard npm runtime; use the same
      # Node and npm as CI.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      # Ad-hoc signed only; the sign-macos job re-signs every nested binary
      # with the Developer ID identity. Swift packages resolve only to the
      # committed Package.resolved.
      - name: Archive
        run: |
          xcodebuild archive \
            -project apps/purepoint-macos/purepoint-macos.xcodeproj \
            -scheme purepoint-macos \
            -configuration Release \
            -onlyUsePackageVersionsFromResolvedFile \
            -archivePath build/PurePoint.xcarchive \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # tar keeps the bundle's symlinks and modes, which artifact upload drops.
      - name: Package unsigned app
        run: |
          tar -C build/PurePoint.xcarchive/Products/Applications \
            -cf build/PurePoint-unsigned.tar PurePoint.app

      - name: Upload unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app-unsigned
          path: build/PurePoint-unsigned.tar
          if-no-files-found: error
          retention-days: 14

  # Holds the Developer ID identity, the notarization credentials and the
  # Sparkle update key. Runs only Apple's tools, this repository's signing
  # scripts, and Sparkle and create-dmg releases verified by SHA-256.
  sign-macos:
    name: Sign and notarize macOS app
    needs: [version, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.raw }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      APP_PATH: build/export/PurePoint.app
      DMG_PATH: build/PurePoint-${{ needs.version.outputs.raw }}.dmg
      # Must match the Sparkle version the app links (Package.resolved).
      SPARKLE_VERSION: 2.9.0
      SPARKLE_SHA256: 01e0f0ebf6614061ea816d414de50f937d64ffa6822ad572243031ca3676fe19
      # create-dmg v1.3.0, fetched by commit so the archive can't move with the tag.
      CREATE_DMG_COMMIT: a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f
      CREATE_DMG_SHA256: 36577b966f16c12dd78d5bb5107c2ae3d069b044226b6ebbffa6a434ce142d0a
    steps:
      - name: Set signing paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "CERT_PATH=$RUNNER_TEMP/certificate.p12" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download unsigned app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-app-unsigned
          path: build

      - name: Unpack unsigned app
        run: |
          mkdir -p build/export
          tar -xf build/PurePoint-unsigned.tar -C build/export
          rm build/PurePoint-unsigned.tar
          # Extended attributes picked up in transit fail strict verification.
          xattr -cr "$APP_PATH"

      - name: Install Sparkle tools
        run: |
          ARCHIVE="$RUNNER_TEMP/sparkle.tar.xz"
          curl -fsSL --proto '=https' \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$ARCHIVE"
          echo "${SPARKLE_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$ARCHIVE" -C "$RUNNER_TEMP/sparkle"

      - name: Install create-dmg
        run: |
          ARCHIVE="$RUNNER_TEMP/create-dmg.tar.gz"
          curl -fsSL --proto '=https' \
            "https://github.com/create-dmg/create-dmg/archive/${CREATE_DMG_COMMIT}.tar.gz" \
            -o "$ARCHIVE"
          echo "${CREATE_DMG_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"

      # The key is not extractable (-x) and only codesign may use it (-T). The
      # keychain locks itself after 15 idle minutes; signing steps unlock it.
      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -x -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Sign app
        run: |
          bash .github/scripts/sign-macos-app.sh "$APP_PATH" "Developer ID Application"
          security lock-keychain "$KEYCHAIN_PATH"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ZIP_PATH="$RUNNER_TEMP/PurePoint-notarize.zip"

          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"

      # A non-zero exit is tolerated only when a complete, verifiable DMG was
      # still written (create-dmg reports some Finder layout steps that way);
      # anything else fails the release.
      - name: Create DMG
        run: |
          STATUS=0
          "$RUNNER_TEMP/create-dmg-${CREATE_DMG_COMMIT}/create-dmg" \
            --volname "PurePoint" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "PurePoint.app" 150 190 \
            --app-drop-link 450 190 \
            --hide-extension "PurePoint.app" \
            "$DMG_PATH" \
            "$APP_PATH" \
            || STATUS=$?

          if [ ! -f "$DMG_PATH" ] || ! hdiutil verify "$DMG_PATH"; then
            echo "::error::create-dmg exited with status $STATUS and did not produce a valid $DMG_PATH"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::create-dmg exited with status $STATUS, but $DMG_PATH is complete and verifies"
          fi
          ls -la "$DMG_PATH"

      # Last use of the signing identity: the keychain is deleted right after.
      - name: Sign DMG
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          codesign --force --sign "Developer ID Application" \
            --options runtime "$DMG_PATH"
          security delete-keychain "$KEYCHAIN_PATH"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Sign DMG with Sparkle Ed25519
        id: sparkle_sign
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          SIGN_OUTPUT=$(printf '%s\n' "$SPARKLE_ED25519_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" "$DMG_PATH" --ed-key-file -)
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          if [ -z "$ED_SIGNATURE" ] || [ -z "$LENGTH" ]; then
            echo "::error::sign_update did not report an edSignature and length"
            exit 1
          fi
          echo "ED_SIGNATURE=${ED_SIGNATURE}" >> "$GITHUB_ENV"
          echo "LENGTH=${LENGTH}" >> "$GITHUB_ENV"

      # The app sets SURequireSignedFeed, so the feed itself carries an EdDSA
      # signature from the same key as the DMG.
      - name: Generate and sign appcast
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          DMG_URL="https://github.com/2witstudios/purepoint/releases/download/v${VERSION}/PurePoint-${VERSION}.dmg"
          PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S %z')"

          mkdir -p build/appcast
          cat > build/appcast/appcast.xml << APPCAST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>PurePoint</title>
              <item>
                <title>PurePoint v${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <enclosure url="${DMG_URL}" sparkle:edSignature="${ED_SIGNATURE}" length="${LENGTH}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          APPCAST_EOF

          printf '%s\n' "$SPARKLE_ED25519_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" build/appcast/appcast.xml --ed-key-file - > /dev/null
          printf '%s\n' "$SPARKLE_ED25519_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --verify build/appcast/appcast.xml --ed-key-file - > /dev/null

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload appcast
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-appcast
          path: build/appcast/appcast.xml
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERT_PATH"

  # Static pu + pu-engine for Linux servers (installed by scripts/install.sh).
  # Built natively per arch against musl, so no glibc version floor applies.
  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins 1.89 for every in-repo cargo call, so the
      # targets installed above land on 1.94.0 while the build runs on the
      # pinned toolchain. Add the target there too, as the macOS build phase
      # does for its Apple targets.
      - name: Add target to the pinned toolchain
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p pu-cli -p pu-engine
        env:
          TARGET: ${{ matrix.target }}

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.version.outputs.raw }}
          TARGET: ${{ matrix.target }}
        run: |
          NAME="purepoint-${VERSION}-${TARGET}"
          mkdir -p "dist/${NAME}"
          cp "target/${TARGET}/release/pu" "target/${TARGET}/release/pu-engine" "dist/${NAME}/"
          cp LICENSE* README.md "dist/${NAME}/" 2>/dev/null || true
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  # CycloneDX SBOMs for the Rust binaries and the bundled npm runtime. Holds
  # no secrets; its outputs are attested by the attest job.
  sbom:
    name: Generate SBOMs
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_CYCLONEDX_VERSION: 0.5.9
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      # Installed outside the repository so its own lockfile and the 1.94.0
      # toolchain apply.
      - name: Install cargo-cyclonedx
        working-directory: ${{ runner.temp }}
        run: cargo install --locked cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION"

      - name: Generate SBOMs
        env:
          VERSION: ${{ needs.version.outputs.raw }}
        run: |
          mkdir -p dist
          cargo cyclonedx --format json --spec-version 1.5 --target all --all
          for crate in pu-cli pu-engine; do
            mapfile -t found < <(find "crates/$crate" -maxdepth 1 -name '*.cdx.json')
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected one SBOM for $crate, found ${#found[@]}"
              exit 1
            fi
            cp "${found[0]}" "dist/purepoint-${VERSION}-${crate}.cdx.json"
          done

          cd apps/purepoint-mobile
          npm ci --ignore-scripts
          # The package is private and unversioned; the SBOM names the release.
          npm pkg set version="$VERSION"
          npm sbom --omit=dev --sbom-format cyclonedx > "../../dist/purepoint-${VERSION}-point-guard-npm.cdx.json"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Signs the Linux archives with the release minisign key that
  # scripts/install.sh embeds. Runs only this repository's OpenSSL wrapper.
  # Until the RELEASE_MINISIGN_KEY secret exists, releases ship without
  # signatures (and say so); install.sh then relies on build provenance.
  sign-linux:
    name: Sign Linux archives
    needs: linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: purepoint-*
          path: dist
          merge-multiple: true

      - name: Sign archives
        id: sign
        env:
          RELEASE_MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
        run: |
          if [ -z "$RELEASE_MINISIGN_KEY" ]; then
            echo "::warning title=Linux archives are unsigned::RELEASE_MINISIGN_KEY is not set in the release environment, so this release has no .minisig files. See docs/architecture/distribution.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEY="$RUNNER_TEMP/release-minisign.pem"
          (umask 077 && printf '%s\n' "$RELEASE_MINISIGN_KEY" > "$KEY")
          EXPECTED=$(sed -n 's/^RELEASE_PUBLIC_KEY="\(.*\)"$/\1/p' scripts/install.sh)
          ACTUAL=$(bash .github/scripts/minisign.sh pubkey "$KEY")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            rm -f "$KEY"
            echo "::error::RELEASE_MINISIGN_KEY does not match the public key in scripts/install.sh"
            exit 1
          fi
          bash .github/scripts/minisign.sh sign "$KEY" dist/*.tar.gz
          rm -f "$KEY"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signatures
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-signatures
          path: dist/*.minisig
          if-no-files-found: error
          retention-days: 14

  # Records GitHub build provenance for every release binary and attests the
  # SBOMs against them (verify with `gh attestation verify`). Runs no
  # repository code.
  attest:
    name: Attest release artifacts
    needs: [version, sign-macos, linux, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: purepoint-*
          path: dist
          merge-multiple: true

      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: dist

      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: sbom

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.dmg

      - name: Attest pu SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.dmg
          sbom-path: sbom/purepoint-${{ needs.version.outputs.raw }}-pu-cli.cdx.json

      - name: Attest pu-engine SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.dmg
          sbom-path: sbom/purepoint-${{ needs.version.outputs.raw }}-pu-engine.cdx.json

      - name: Attest Point Guard npm SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.dmg
          sbom-path: sbom/purepoint-${{ needs.version.outputs.raw }}-point-guard-npm.cdx.json

  # The only job with a write token. It runs no build code: it creates the
  # release with every asset in one step, then points the update feed at it.
  # Versioned assets are never replaced; a re-run against an existing release
  # only checks that the release already has them. Nothing is published until
  # every artifact is signed and attested.
  publish:
    name: Publish release
    needs: [version, sign-macos, linux, sbom, sign-linux, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.raw }}
    steps:
      - name: Download Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: purepoint-*
          path: dist
          merge-multiple: true

      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: dist

      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: dist

      # Absent when the release environment has no signing key yet.
      - name: Download Linux signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-signatures
          path: dist
          merge-multiple: true

      - name: Download appcast
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-appcast
          path: build

      # A re-run of every job re-signs and re-notarizes the DMG, which changes
      # its bytes. The appcast must never carry a signature for a DMG other
      # than the published one, so an existing release must match exactly.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "PurePoint $TAG" \
              --generate-notes
            exit 0
          fi
          echo "::notice::$TAG already exists; its assets are left unchanged"
          PUBLISHED=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | "\(.digest) \(.name)"')
          for FILE in dist/*; do
            EXPECTED="sha256:$(sha256sum "$FILE" | cut -d' ' -f1) $(basename "$FILE")"
            if ! grep -qxF "$EXPECTED" <<< "$PUBLISHED"; then
              echo "::error::$TAG assets already published with different content ($(basename "$FILE")); delete the release, or use Re-run failed jobs instead of re-running all jobs"
              exit 1
            fi
          done

      # The `appcast` release is the moving update feed, so its appcast.xml is
      # the one asset that is replaced on every release. The signing job
      # generated and signed it.
      - name: Upload appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload appcast build/appcast.xml --clobber
