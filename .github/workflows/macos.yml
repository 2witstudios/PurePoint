name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  # Pull requests skip packaging proofs their changes cannot affect and the
  # Intel legs; main, the nightly run and manual runs prove everything.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; main, nightly and manual
  # runs each finish their full proof.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  changes:
    name: Changed components
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      mobile: ${{ steps.paths.outputs.mobile }}
      mobile_swift: ${{ steps.paths.outputs.mobile_swift }}
      packaging: ${{ steps.paths.outputs.packaging }}
      release_archive: ${{ steps.paths.outputs.release_archive }}
      universal: ${{ steps.paths.outputs.universal }}
      linux_phone: ${{ steps.paths.outputs.linux_phone }}
      runtime_targets: ${{ steps.paths.outputs.runtime_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # minisign lets the install script tests also check signature
      # compatibility with the reference implementation.
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends minisign
      - name: Check CI routing and release scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Detect changed components
        id: paths
        run: python3 .github/scripts/ci.py changes

  mobile-bridge:
    name: Mobile bridge
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/purepoint-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/purepoint-mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - name: Build isolated lock helper for bridge proofs
        run: |
          printf 'CARGO_TARGET_DIR=%s/bridge-lock-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          CARGO_TARGET_DIR="$RUNNER_TEMP/bridge-lock-cargo" cargo build --locked -p pu-cli --bin pu-point-guard-lock
          printf 'POINT_GUARD_LOCK_HELPER_PATH=%s/bridge-lock-cargo/debug/pu-point-guard-lock\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      # Registry signatures and provenance of every installed package, and no
      # known high-severity advisory in what ships with the app.
      - name: Verify npm package signatures
        run: npm audit signatures
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - name: Interrupted package download recovery
        run: python3 runtime/test-package-runtime.py

  mobile-swift:
    name: Mobile Swift & iOS tests
    needs: changes
    if: needs.changes.outputs.mobile_swift == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/purepoint-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/purepoint-mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - name: Build isolated lock helper for actual trust fixtures
        run: |
          printf 'CARGO_TARGET_DIR=%s/mobile-lock-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          CARGO_TARGET_DIR="$RUNNER_TEMP/mobile-lock-cargo" cargo build --locked -p pu-cli --bin pu-point-guard-lock
          printf 'POINT_GUARD_LOCK_HELPER_PATH=%s/mobile-lock-cargo/debug/pu-point-guard-lock\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Shared chat Markdown parser tests
        run: python3 ../shared/ChatMarkdown/check-markdown.py
      - name: Swift domain and recovery checks
        run: |
          swiftc PurePoint/ChatDomain.swift verification/LogicChecks.swift -o "$RUNNER_TEMP/mobile-logic"
          "$RUNNER_TEMP/mobile-logic"
          swiftc PurePoint/ChatDomain.swift verification/ResponsivenessChecks.swift -o "$RUNNER_TEMP/mobile-responsiveness"
          "$RUNNER_TEMP/mobile-responsiveness"
          sh verification/check-recovery.sh
          sh verification/check-agent-control.sh
          sh verification/check-navigation.sh
          sh verification/check-machines.sh
          sh verification/check-trust-rollback.sh
          python3 verification/check-machine-network.py
          python3 verification/check-trust.py
          swiftc -typecheck -strict-concurrency=complete -warnings-as-errors PurePoint/ChatDomain.swift PurePoint/PairingSecret.swift PurePoint/AgentControlDomain.swift PurePoint/AgentControlModel.swift PurePoint/ChatModel.swift
          swiftc -frontend -parse PurePoint/*.swift PurePointTests/*.swift
          plutil -lint PurePoint.xcodeproj/project.pbxproj PurePoint/Info.plist
      - name: iOS simulator tests
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/mobile-simulators.json"
          simulator_id=$(python3 -c 'import json, os; data = json.load(open(os.environ["RUNNER_TEMP"] + "/mobile-simulators.json")); print(next(device["udid"] for runtime, devices in sorted(data["devices"].items(), reverse=True) if "iOS" in runtime for device in devices if device["name"].startswith("iPhone") and device["isAvailable"]))')
          xcodebuild build-for-testing \
            -project PurePoint.xcodeproj \
            -scheme PurePoint-Debug \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/mobile-derived" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=""
          python3 runtime/verify-simulator-signing.py --app "$RUNNER_TEMP/mobile-derived/Build/Products/Debug-iphonesimulator/PurePoint.app" --diagnostics "$RUNNER_TEMP/mobile-diagnostics/signing"
          xcodebuild test-without-building \
            -project PurePoint.xcodeproj \
            -scheme PurePoint-Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/mobile-derived" \
            -resultBundlePath "$RUNNER_TEMP/mobile-diagnostics/tests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=""
      - name: Retain iOS signature and XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-diagnostics
          path: ${{ runner.temp }}/mobile-diagnostics
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: macOS Build & Test
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCHEME: purepoint-macos
      PROJECT: apps/purepoint-macos/purepoint-macos.xcodeproj
      DESTINATION: "platform=macOS"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"

      - name: Isolate macOS artifact Rust output
        run: printf 'CARGO_TARGET_DIR=%s/macos-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Pinned release, checked against its SHA-256 instead of Homebrew's moving formula.
      - name: Install xcbeautify
        env:
          XCBEAUTIFY_VERSION: 3.2.1
          XCBEAUTIFY_SHA256: 87fdbe786f71d7b2ee28c5c1ca97087587292f2c5c6f9e721cf02db8b2a3c241
        run: |
          ARCHIVE="$RUNNER_TEMP/xcbeautify.zip"
          curl -fsSL --proto '=https' \
            "https://github.com/cpisciotta/xcbeautify/releases/download/${XCBEAUTIFY_VERSION}/xcbeautify-${XCBEAUTIFY_VERSION}-universal-apple-macosx.zip" \
            -o "$ARCHIVE"
          echo "${XCBEAUTIFY_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/xcbeautify"
          echo "$RUNNER_TEMP/xcbeautify/release" >> "$GITHUB_PATH"

      - name: Checkout pinned local tree-sitter packages
        run: bash .github/scripts/checkout-tree-sitter.sh

      - name: Prepare local packages for Xcode
        run: |
          # Xcode 26 ignores the explicit `sources` parameter in local SPM packages,
          # so restructure each package to use path-based auto-discovery instead.
          for pkg in apps/purepoint-macos/LocalPackages/tree-sitter-*; do
            lib=$(sed -n 's/.*name: "\(TreeSitter[^"]*\)".*/\1/p' "$pkg/Package.swift" | head -1)
            # Copy public header into src/include/
            mkdir -p "$pkg/src/include"
            find "$pkg/bindings/swift" -name '*.h' -exec cp {} "$pkg/src/include/" \;
            # Copy queries into src/ so resources path works with path: "src"
            cp -r "$pkg/queries" "$pkg/src/queries" 2>/dev/null || true
            # Remove non-C/H files from src/ (JSON metadata confuses SPM)
            find "$pkg/src" -type f -not -name '*.c' -not -name '*.h' -not -name '*.scm' -delete
            find "$pkg/src" -type d -empty -delete 2>/dev/null || true
            # Rewrite Package.swift: use path "src" so SPM auto-discovers all .c files
            cat > "$pkg/Package.swift" << PKGEOF
          // swift-tools-version:5.3
          import PackageDescription
          let package = Package(
              name: "$lib",
              products: [.library(name: "$lib", targets: ["$lib"])],
              targets: [
                  .target(
                      name: "$lib",
                      path: "src",
                      resources: [.copy("queries")],
                      publicHeadersPath: "include",
                      cSettings: [.headerSearchPath(".")]
                  ),
              ],
              cLanguageStandard: .c11
          )
          PKGEOF
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Prepare actual shared bridge dependencies and isolated helper
        run: |
          npm ci --ignore-scripts --prefix apps/purepoint-mobile
          cargo build --locked -p pu-cli --bin pu-point-guard-lock
          printf 'POINT_GUARD_LOCK_HELPER_PATH=%s/debug/pu-point-guard-lock\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
      - name: Check shared actual phone and desktop Point Guard integration
        run: python3 apps/purepoint-macos/verification/check-point-guard.py
      - name: Check managed Point Guard service model
        run: python3 apps/purepoint-macos/verification/check-point-guard-service.py
      - name: Check pane-local Point Guard conversation sidebar
        run: python3 apps/purepoint-macos/verification/check-point-guard-sidebar.py
      - name: Check app bundle seal before bridge launch
        run: python3 apps/purepoint-macos/verification/check-bundle-seal.py

      - name: Compile app and test bundles
        timeout-minutes: 18
        run: |
          python3 .github/scripts/log_macos_command.py "$RUNNER_TEMP/macos-diagnostics/compile" \
            xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/purepoint-derived" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Execute compiled tests
        timeout-minutes: 8
        run: |
          python3 .github/scripts/log_macos_command.py "$RUNNER_TEMP/macos-diagnostics/test" \
            xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/purepoint-derived" \
            -resultBundlePath "$RUNNER_TEMP/macos-diagnostics/tests.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Retain macOS failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-diagnostics
          path: ${{ runner.temp }}/macos-diagnostics
          if-no-files-found: warn
          retention-days: 7

  runtime-package:
    name: Point Guard package (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.runtime_targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - name: Set isolated build directory
        run: printf 'CARGO_TARGET_DIR=%s/pointguard-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build isolated artifact CLI
        run: cargo build --locked --release -p pu-cli
      - name: Stage complete pinned runtime
        run: |
          python3 apps/purepoint-mobile/runtime/package-runtime.py \
            --app "$RUNNER_TEMP/PointGuardProof.app" \
            --pu "$CARGO_TARGET_DIR/release/pu" \
            --architecture "${{ matrix.architecture }}"
      - name: Verify complete advertised native graph
        run: python3 apps/purepoint-mobile/runtime/verify-runtime.py --app "$RUNNER_TEMP/PointGuardProof.app"
      - name: Sign and verify nested artifact code (ad-hoc only)
        run: |
          python3 apps/purepoint-mobile/runtime/sign-runtime.py --app "$RUNNER_TEMP/PointGuardProof.app" --identity -
          /usr/bin/lipo "$RUNNER_TEMP/PointGuardProof.app/Contents/Helpers/point-guard-node" -verify_arch ${{ matrix.architecture == 'x64' && 'x86_64' || 'arm64' }}
          /usr/bin/lipo "$RUNNER_TEMP/PointGuardProof.app/Contents/Helpers/pu" -verify_arch ${{ matrix.architecture == 'x64' && 'x86_64' || 'arm64' }}
      - name: Repeat signed build-artifact staging and verify outer seal
        run: python3 apps/purepoint-mobile/runtime/prove-restaging.py --app "$RUNNER_TEMP/PointGuardProof.app" --pu "$CARGO_TARGET_DIR/release/pu" --architecture "${{ matrix.architecture }}"
      - name: Relocated clean native startup and state-preserving replacement
        run: node apps/purepoint-mobile/runtime/prove-runtime.mjs "$RUNNER_TEMP/PointGuardProof.app"
      - name: Retain nonpublishing proof artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: point-guard-runtime-${{ matrix.architecture }}
          path: ${{ runner.temp }}/PointGuardProof.app
          retention-days: 7

  runtime-universal:
    name: Point Guard universal package (${{ matrix.architecture }})
    needs: [changes, runtime-package]
    if: needs.changes.outputs.universal == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: point-guard-runtime-arm64
          path: ${{ runner.temp }}/arm64-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: point-guard-runtime-x64
          path: ${{ runner.temp }}/x64-input
      - name: Compose exact-run CLI slices and stage universal runtime
        run: |
          /usr/bin/lipo -create "$RUNNER_TEMP/arm64-input/Contents/Helpers/pu" "$RUNNER_TEMP/x64-input/Contents/Helpers/pu" -output "$RUNNER_TEMP/universal-pu"
          /usr/bin/lipo -create "$RUNNER_TEMP/arm64-input/Contents/Helpers/point-guard-lock" "$RUNNER_TEMP/x64-input/Contents/Helpers/point-guard-lock" -output "$RUNNER_TEMP/universal-lock-helper"
          python3 apps/purepoint-mobile/runtime/package-runtime.py --app "$RUNNER_TEMP/UniversalProof.app" --pu "$RUNNER_TEMP/universal-pu" --lock-helper "$RUNNER_TEMP/universal-lock-helper" --architecture universal
          python3 apps/purepoint-mobile/runtime/verify-runtime.py --app "$RUNNER_TEMP/UniversalProof.app"
      - name: Sign nested runtime and verify repeated outer artifact seal (ad-hoc only)
        run: python3 apps/purepoint-mobile/runtime/prove-restaging.py --app "$RUNNER_TEMP/UniversalProof.app" --pu "$RUNNER_TEMP/universal-pu" --lock-helper "$RUNNER_TEMP/universal-lock-helper" --architecture universal
      - name: Launch relocated universal runtime on native architecture
        run: node apps/purepoint-mobile/runtime/prove-runtime.mjs "$RUNNER_TEMP/UniversalProof.app"
      - name: Retain nonpublishing universal proof artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: point-guard-runtime-universal-${{ matrix.architecture }}
          path: ${{ runner.temp }}/UniversalProof.app
          retention-days: 7

  runtime-rust:
    name: Runtime Rust full checks
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - name: Set isolated Rust output
        run: printf 'CARGO_TARGET_DIR=%s/runtime-rust-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  # Linux phone host (LPH): `pu phone` unit tests, then the x64 bridge payload
  # packaged, installed by install.sh into a throwaway HOME, and launched in a
  # clean environment with a pinned-TLS enrollment, revocation and restart.
  # The bridge's own tests already run on Linux in mobile-bridge.
  runtime-linux:
    name: Linux phone access payload (x64)
    needs: changes
    if: needs.changes.outputs.linux_phone == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pulled by digest from a mirror without Docker Hub's anonymous limit.
      ALPINE_IMAGE: public.ecr.aws/docker/library/alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 # 3.22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - name: Set isolated Rust output
        run: printf 'CARGO_TARGET_DIR=%s/linux-phone-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: pu phone unit tests
        run: cargo test --locked -p pu-cli phone
      - name: Build pu, pu-engine and the lock helper
        run: cargo build --locked -p pu-cli -p pu-engine
      - name: Package the x64 payload
        run: |
          PU_VERSION=$(python3 apps/purepoint-mobile/runtime/package-runtime.py --print-pu-version)
          python3 apps/purepoint-mobile/runtime/package-runtime.py --layout dir \
            --target linux-x64 \
            --out "$RUNNER_TEMP/phone" \
            --lock-helper "$CARGO_TARGET_DIR/debug/pu-point-guard-lock" \
            --pu-version "$PU_VERSION" \
            --cache "$RUNNER_TEMP/node-cache"
          {
            echo "PU_VERSION=$PU_VERSION"
            echo "PHONE_NAME=purepoint-pointguard-${PU_VERSION}-x86_64-linux-gnu"
          } >> "$GITHUB_ENV"
      - name: Launch relocated payload in a clean environment
        run: |
          "$RUNNER_TEMP/phone/$PHONE_NAME/bin/node" apps/purepoint-mobile/runtime/prove-linux-runtime.mjs \
            "$RUNNER_TEMP/phone/$PHONE_NAME" "$CARGO_TARGET_DIR/debug/pu"
      - name: Install with install.sh into a throwaway HOME and launch in place
        run: |
          # Same layout as a release tarball; install.sh only copies pu and pu-engine.
          NAME="purepoint-ci-x86_64-linux"
          mkdir -p "$RUNNER_TEMP/pu-archive/$NAME"
          cp "$CARGO_TARGET_DIR/debug/pu" "$CARGO_TARGET_DIR/debug/pu-engine" "$RUNNER_TEMP/pu-archive/$NAME/"
          tar -C "$RUNNER_TEMP/pu-archive" -czf "$RUNNER_TEMP/$NAME.tar.gz" "$NAME"
          echo "PU_TARBALL=$RUNNER_TEMP/$NAME.tar.gz" >> "$GITHUB_ENV"
          SMOKE_HOME="$RUNNER_TEMP/smoke-home"
          mkdir -m 700 "$SMOKE_HOME"
          run_install() {
            env -i HOME="$SMOKE_HOME" PATH=/usr/bin:/bin PU_ARCHIVE="$RUNNER_TEMP/$NAME.tar.gz" \
              PU_PHONE_ARCHIVE="$RUNNER_TEMP/phone/$PHONE_NAME.tar.gz" sh scripts/install.sh
          }
          run_install
          INSTALLED="$SMOKE_HOME/.pu/pointguard/$PU_VERSION"
          "$INSTALLED/bin/node" apps/purepoint-mobile/runtime/prove-linux-runtime.mjs \
            "$INSTALLED" "$SMOKE_HOME/.pu/bin/pu" --in-place
          # A second install never modifies the existing version directory.
          BEFORE=$(stat -c '%i %Y' "$INSTALLED")
          run_install | grep -F "already installed"
          [ "$(stat -c '%i %Y' "$INSTALLED")" = "$BEFORE" ]
      # The runner is an ephemeral VM with systemd as PID 1, so this step uses
      # its real HOME and user manager to prove the unit pu phone writes.
      - name: Run phone access as a systemd user service
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin PU_ARCHIVE="$PU_TARBALL" \
            PU_PHONE_ARCHIVE="$RUNNER_TEMP/phone/$PHONE_NAME.tar.gz" sh scripts/install.sh
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 100); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.2; done
          PU="$HOME/.pu/bin/pu"
          UNIT_FILE="$HOME/.config/systemd/user/pu-pointguard.service"
          ready() {
            for _ in $(seq 60); do
              if "$PU" phone status --json > "$RUNNER_TEMP/status.json" &&
                [ "$(jq -r '.pointGuard.phase // empty' "$RUNNER_TEMP/status.json")" = ready ]; then
                return 0
              fi
              sleep 1
            done
            cat "$RUNNER_TEMP/status.json"
            return 1
          }
          "$PU" phone install --now
          ready
          grep -qxF 'NoNewPrivileges=yes' "$UNIT_FILE"
          grep -qxF 'UMask=0077' "$UNIT_FILE"
          [ "$(stat -c %a "$UNIT_FILE")" = 644 ]
          # Owner admin is a private Unix socket, not a TCP port.
          STATE="$HOME/.local/state/purepoint/point-guard"
          [ "$(stat -c %a "$STATE/admin")" = 700 ]
          [ "$(stat -c %a "$STATE/admin/admin.sock")" = 600 ]
          "$PU" phone devices | grep -F "No paired devices"
          HOST=$(jq -r .pointGuard.hostId "$RUNNER_TEMP/status.json")
          # The bridge's environment excludes inherited loader and Node options.
          PID=$(systemctl --user show -p MainPID --value pu-pointguard.service)
          if tr '\0' '\n' < "/proc/$PID/environ" | grep -E '^(NODE_OPTIONS|LD_PRELOAD|PU_ENGINE_PATH)='; then exit 1; fi
          "$PU" phone restart
          ready
          [ "$(jq -r .pointGuard.hostId "$RUNNER_TEMP/status.json")" = "$HOST" ]
          # An idle stop exits 0, so Restart=on-failure never resurrects it.
          "$PU" phone stop
          sleep 8
          [ "$(systemctl --user is-active pu-pointguard.service || true)" = inactive ]
          "$PU" phone uninstall
          [ ! -e "$UNIT_FILE" ]
          # Device trust and host identity outlive the service.
          [ -f "$STATE/trust/trust.json" ]
      - name: Point Guard service journal
        if: failure()
        run: XDG_RUNTIME_DIR="/run/user/$(id -u)" journalctl --user -u pu-pointguard.service --no-pager | tail -200 || true
      - name: Refuse phone access on musl and keep pu installed
        run: |
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/scripts/install.sh:/install.sh:ro" \
            -v "$PU_TARBALL:/pu.tar.gz:ro" \
            -v "$RUNNER_TEMP/phone/$PHONE_NAME.tar.gz:/phone.tar.gz:ro" \
            -e HOME=/tmp -e PU_ARCHIVE=/pu.tar.gz -e PU_PHONE_ARCHIVE=/phone.tar.gz \
            "$ALPINE_IMAGE" sh -c 'sh /install.sh; code=$?; test -x /tmp/.pu/bin/pu && test -x /tmp/.pu/bin/pu-engine && test ! -e /tmp/.pu/pointguard && exit $code' \
            > "$RUNNER_TEMP/musl.log" 2>&1
          CODE=$?
          set -e
          cat "$RUNNER_TEMP/musl.log"
          [ "$CODE" -eq 3 ]
          grep -F "glibc ≥ 2.28 required for phone access" "$RUNNER_TEMP/musl.log"

  release-archive:
    needs: changes
    if: needs.changes.outputs.release_archive == 'true'
    uses: ./.github/workflows/release-proof.yml

  build-and-test:
    name: Build & Test
    if: always()
    needs: [changes, macos, release-archive, mobile-bridge, mobile-swift, runtime-package, runtime-universal, runtime-rust, runtime-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable check to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci.py gate
