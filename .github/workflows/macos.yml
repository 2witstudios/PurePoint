name: macOS Build & Test

on:
  push:
    branches: [main]
    paths: &macos-paths
      - "apps/purepoint-macos/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/macos.yml"
  pull_request:
    paths: *macos-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: purepoint-macos
  PROJECT: apps/purepoint-macos/purepoint-macos.xcodeproj
  DESTINATION: "platform=macOS"

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Clone local tree-sitter packages
        run: |
          mkdir -p apps/purepoint-macos/LocalPackages
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-css.git apps/purepoint-macos/LocalPackages/tree-sitter-css
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-javascript.git apps/purepoint-macos/LocalPackages/tree-sitter-javascript
          git clone --depth 1 https://github.com/tree-sitter-grammars/tree-sitter-lua.git apps/purepoint-macos/LocalPackages/tree-sitter-lua
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-python.git apps/purepoint-macos/LocalPackages/tree-sitter-python
          git clone --depth 1 https://github.com/tree-sitter-grammars/tree-sitter-yaml.git apps/purepoint-macos/LocalPackages/tree-sitter-yaml

      - name: Prepare local packages for Xcode
        run: |
          # Strip non-essential files and rewrite Package.swift so SPM auto-discovers
          # all C sources (works around Xcode 26 ignoring explicit `sources` parameter)
          for pkg in apps/purepoint-macos/LocalPackages/tree-sitter-*; do
            name=$(basename "$pkg")
            # Remove everything except Package.swift, src/, bindings/swift/, queries/
            find "$pkg" -maxdepth 1 \
              -not -name '.' \
              -not -name 'Package.swift' \
              -not -name 'src' \
              -not -name 'bindings' \
              -not -name 'queries' \
              -exec rm -rf {} +
            rm -rf "$pkg/bindings/go" "$pkg/bindings/python" "$pkg/bindings/rust" \
                   "$pkg/bindings/swift/"*Tests
            # Remove non-C files from src/ that SPM might choke on
            find "$pkg/src" -type f -not -name '*.c' -not -name '*.h' -delete
            find "$pkg/src" -type d -empty -delete 2>/dev/null || true
          done

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            | xcbeautify

      - name: Test
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            | xcbeautify
