name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  changes:
    name: Changed components
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      mobile: ${{ steps.paths.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check CI routing
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Detect changed components
        id: paths
        run: python3 .github/scripts/ci.py changes

  mobile-bridge:
    name: Mobile bridge
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/purepoint-mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/purepoint-mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  mobile-swift:
    name: Mobile Swift & iOS tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/purepoint-mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift domain and recovery checks
        run: |
          swiftc PurePoint/ChatDomain.swift verification/LogicChecks.swift -o "$RUNNER_TEMP/mobile-logic"
          "$RUNNER_TEMP/mobile-logic"
          swiftc PurePoint/ChatDomain.swift verification/ResponsivenessChecks.swift -o "$RUNNER_TEMP/mobile-responsiveness"
          "$RUNNER_TEMP/mobile-responsiveness"
          sh verification/check-recovery.sh
          swiftc -typecheck -strict-concurrency=complete -warnings-as-errors PurePoint/ChatDomain.swift PurePoint/PairingSecret.swift PurePoint/ChatModel.swift
          swiftc -frontend -parse PurePoint/*.swift PurePointTests/*.swift
          plutil -lint PurePoint.xcodeproj/project.pbxproj PurePoint/Info.plist
      - name: iOS simulator tests
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/mobile-simulators.json"
          simulator_id=$(python3 -c 'import json, os; data = json.load(open(os.environ["RUNNER_TEMP"] + "/mobile-simulators.json")); print(next(device["udid"] for runtime, devices in sorted(data["devices"].items(), reverse=True) if "iOS" in runtime for device in devices if device["name"].startswith("iPhone") and device["isAvailable"]))')
          xcodebuild test \
            -project PurePoint.xcodeproj \
            -scheme PurePoint-Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -resultBundlePath "$RUNNER_TEMP/mobile-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

  macos:
    name: macOS Build & Test
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCHEME: purepoint-macos
      PROJECT: apps/purepoint-macos/purepoint-macos.xcodeproj
      DESTINATION: "platform=macOS"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Clone local tree-sitter packages
        run: |
          mkdir -p apps/purepoint-macos/LocalPackages
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-css.git apps/purepoint-macos/LocalPackages/tree-sitter-css
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-javascript.git apps/purepoint-macos/LocalPackages/tree-sitter-javascript
          git clone --depth 1 https://github.com/tree-sitter-grammars/tree-sitter-lua.git apps/purepoint-macos/LocalPackages/tree-sitter-lua
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-python.git apps/purepoint-macos/LocalPackages/tree-sitter-python
          git clone --depth 1 https://github.com/tree-sitter-grammars/tree-sitter-yaml.git apps/purepoint-macos/LocalPackages/tree-sitter-yaml

      - name: Prepare local packages for Xcode
        run: |
          # Xcode 26 ignores the explicit `sources` parameter in local SPM packages,
          # so restructure each package to use path-based auto-discovery instead.
          for pkg in apps/purepoint-macos/LocalPackages/tree-sitter-*; do
            lib=$(sed -n 's/.*name: "\(TreeSitter[^"]*\)".*/\1/p' "$pkg/Package.swift" | head -1)
            # Copy public header into src/include/
            mkdir -p "$pkg/src/include"
            find "$pkg/bindings/swift" -name '*.h' -exec cp {} "$pkg/src/include/" \;
            # Copy queries into src/ so resources path works with path: "src"
            cp -r "$pkg/queries" "$pkg/src/queries" 2>/dev/null || true
            # Remove non-C/H files from src/ (JSON metadata confuses SPM)
            find "$pkg/src" -type f -not -name '*.c' -not -name '*.h' -not -name '*.scm' -delete
            find "$pkg/src" -type d -empty -delete 2>/dev/null || true
            # Rewrite Package.swift: use path "src" so SPM auto-discovers all .c files
            cat > "$pkg/Package.swift" << PKGEOF
          // swift-tools-version:5.3
          import PackageDescription
          let package = Package(
              name: "$lib",
              products: [.library(name: "$lib", targets: ["$lib"])],
              targets: [
                  .target(
                      name: "$lib",
                      path: "src",
                      resources: [.copy("queries")],
                      publicHeadersPath: "include",
                      cSettings: [.headerSearchPath(".")]
                  ),
              ],
              cLanguageStandard: .c11
          )
          PKGEOF
          done

      - name: Check managed Point Guard service model
        run: python3 apps/purepoint-macos/verification/check-point-guard-service.py

      - name: Compile app and test bundles
        timeout-minutes: 18
        run: |
          python3 .github/scripts/log_macos_command.py "$RUNNER_TEMP/macos-diagnostics/compile" \
            xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/purepoint-derived" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Execute compiled tests
        timeout-minutes: 8
        run: |
          python3 .github/scripts/log_macos_command.py "$RUNNER_TEMP/macos-diagnostics/test" \
            xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/purepoint-derived" \
            -resultBundlePath "$RUNNER_TEMP/macos-diagnostics/tests.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Retain macOS failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-diagnostics
          path: ${{ runner.temp }}/macos-diagnostics
          if-no-files-found: warn
          retention-days: 7

  runtime-package:
    name: Point Guard package (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/pointguard-cargo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Build isolated artifact CLI
        run: cargo build --locked --release -p pu-cli
      - name: Stage complete pinned runtime
        run: |
          python3 apps/purepoint-mobile/runtime/package-runtime.py \
            --app "$RUNNER_TEMP/PointGuardProof.app" \
            --pu "$CARGO_TARGET_DIR/release/pu" \
            --architecture "${{ matrix.architecture }}"
      - name: Sign and verify nested artifact code (ad-hoc only)
        run: |
          python3 apps/purepoint-mobile/runtime/sign-runtime.py --app "$RUNNER_TEMP/PointGuardProof.app" --identity -
          /usr/bin/lipo -verify_arch ${{ matrix.architecture == 'x64' && 'x86_64' || 'arm64' }} "$RUNNER_TEMP/PointGuardProof.app/Contents/Helpers/point-guard-node"
          /usr/bin/lipo -verify_arch ${{ matrix.architecture == 'x64' && 'x86_64' || 'arm64' }} "$RUNNER_TEMP/PointGuardProof.app/Contents/Helpers/pu"
      - name: Relocated clean native startup and state-preserving replacement
        run: node apps/purepoint-mobile/runtime/prove-runtime.mjs "$RUNNER_TEMP/PointGuardProof.app"
      - name: Retain nonpublishing proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: point-guard-runtime-${{ matrix.architecture }}
          path: ${{ runner.temp }}/PointGuardProof.app
          retention-days: 7

  build-and-test:
    name: Build & Test
    if: always()
    needs: [changes, macos, mobile-bridge, mobile-swift, runtime-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every applicable check to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 .github/scripts/ci.py gate
          python3 -c 'import json, os; r=json.loads(os.environ["CI_RESULTS"]); expected="success" if r["changes"]["outputs"]["mobile"]=="true" else "skipped"; assert r["runtime-package"]["result"]==expected, r["runtime-package"]'
