name: Release archive proof
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  archive:
    name: Optimized universal Release archive
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record exact candidate and compiler
        run: |
          mkdir -p "$RUNNER_TEMP/release-diagnostics"
          git rev-parse HEAD | tee "$RUNNER_TEMP/release-diagnostics/commit.txt"
          xcodebuild -version | tee "$RUNNER_TEMP/release-diagnostics/xcode.txt"
          xcrun swiftc --version | tee "$RUNNER_TEMP/release-diagnostics/swift.txt"
      - uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Isolate archive Rust output
        run: printf 'CARGO_TARGET_DIR=%s/release-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Pinned release, checked against its SHA-256 instead of Homebrew's moving formula.
      - name: Install log formatter
        env:
          XCBEAUTIFY_VERSION: 3.2.1
          XCBEAUTIFY_SHA256: 87fdbe786f71d7b2ee28c5c1ca97087587292f2c5c6f9e721cf02db8b2a3c241
        run: |
          ARCHIVE="$RUNNER_TEMP/xcbeautify.zip"
          curl -fsSL --proto '=https' \
            "https://github.com/cpisciotta/xcbeautify/releases/download/${XCBEAUTIFY_VERSION}/xcbeautify-${XCBEAUTIFY_VERSION}-universal-apple-macosx.zip" \
            -o "$ARCHIVE"
          echo "${XCBEAUTIFY_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/xcbeautify"
          echo "$RUNNER_TEMP/xcbeautify/release" >> "$GITHUB_PATH"
      - name: Checkout pinned local tree-sitter packages
        run: bash .github/scripts/checkout-tree-sitter.sh

      - name: Prepare local packages for Xcode
        run: |
          # Xcode 26 ignores the explicit `sources` parameter in local SPM packages,
          # so restructure each package to use path-based auto-discovery instead.
          for pkg in apps/purepoint-macos/LocalPackages/tree-sitter-*; do
            lib=$(sed -n 's/.*name: "\(TreeSitter[^"]*\)".*/\1/p' "$pkg/Package.swift" | head -1)
            # Copy public header into src/include/
            mkdir -p "$pkg/src/include"
            find "$pkg/bindings/swift" -name '*.h' -exec cp {} "$pkg/src/include/" \;
            # Copy queries into src/ so resources path works with path: "src"
            cp -r "$pkg/queries" "$pkg/src/queries" 2>/dev/null || true
            # Remove non-C/H files from src/ (JSON metadata confuses SPM)
            find "$pkg/src" -type f -not -name '*.c' -not -name '*.h' -not -name '*.scm' -delete
            find "$pkg/src" -type d -empty -delete 2>/dev/null || true
            # Rewrite Package.swift: use path "src" so SPM auto-discovers all .c files
            cat > "$pkg/Package.swift" << PKGEOF
          // swift-tools-version:5.3
          import PackageDescription
          let package = Package(
              name: "$lib",
              products: [.library(name: "$lib", targets: ["$lib"])],
              targets: [
                  .target(
                      name: "$lib",
                      path: "src",
                      resources: [.copy("queries")],
                      publicHeadersPath: "include",
                      cSettings: [.headerSearchPath(".")]
                  ),
              ],
              cLanguageStandard: .c11
          )
          PKGEOF
          done

      - name: Archive optimized universal app without production credentials
        run: |
          python3 .github/scripts/log_macos_command.py "$RUNNER_TEMP/release-diagnostics/archive" \
            xcodebuild archive \
            -project apps/purepoint-macos/purepoint-macos.xcodeproj \
            -scheme purepoint-macos -configuration Release \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/release-derived" \
            -archivePath "$RUNNER_TEMP/PurePoint.xcarchive" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=''
      - name: Verify archived universal executable and packaged runtime
        run: |
          app="$RUNNER_TEMP/PurePoint.xcarchive/Products/Applications/PurePoint.app"
          for binary in PurePoint pu-engine pu pu-point-guard-lock; do
            /usr/bin/lipo "$app/Contents/MacOS/$binary" -verify_arch arm64 x86_64
          done
          python3 apps/purepoint-mobile/runtime/verify-runtime.py --app "$app"
          /usr/bin/codesign --verify --deep --strict "$app"
      # The release signing job re-signs the unsigned build with this script;
      # an ad-hoc pass proves it covers every nested binary in the bundle.
      - name: Re-sign archived app inside-out
        run: |
          bash .github/scripts/sign-macos-app.sh \
            "$RUNNER_TEMP/PurePoint.xcarchive/Products/Applications/PurePoint.app" -
      - name: Retain Release compiler diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive-diagnostics
          path: ${{ runner.temp }}/release-diagnostics
          retention-days: 7
