name: Security Audit

# Catches newly disclosed advisories against existing deps even when no PRs
# are open. The per-PR deny job in rust.yml also checks advisories, but only
# runs when code changes — this cron fills the gap.
on:
  schedule:
    - cron: "0 9 * * 1" # Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Advisory Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
