function rich(text){return esc(text).replace(/`([^`]+)`/g,'<code class="inlinecode">$1</code>').replace(/(^|\s)(@[\w-]+)/g,'$1<span class="mention">$2</span>')}
function avatar(m,tiny=false){const human=m[0]==='Jono',review=m[0]==='Review';return '<span class="avatar '+(human?'human':review?'review':'')+' '+(tiny?'tinyavatar':'')+'" aria-hidden="true">'+(human?'J':review?'R':m[0]==='Sidebar polish'?'S':'I')+'</span>'}
function message(m,i,grouped=false,thread=false){const list=replies[i]||[];return '<article class="message '+(grouped?'grouped':'')+'" data-message="'+i+'" '+(!thread&&i===unreadStart?'data-unread="true"':'')+'>'+avatar(m)+'<div class="msgcontent"><div class="byline"><strong>'+esc(m[0])+'</strong>'+(!thread&&m[0]!=='Jono'?'<span class="authorbadge">Agent</span>':'')+(m[1]?'<button class="workcontext" data-go="worktree" title="Open '+esc(m[1])+'">'+esc(m[1])+'</button>':'')+'<time>'+esc(m[2])+'</time></div>'+(editing===i&&!thread?'<div class="editing"><textarea aria-label="Edit message">'+esc(m[3])+'</textarea><div class="editactions"><button data-cancel-edit>Cancel</button><button data-save-edit="'+i+'">Save</button></div></div>':'<p>'+rich(m[3])+(edited.has(i)&&!thread?'<span class="edited">(edited)</span>':'')+'</p>')+(m[4]&&m[4]!==m[1]?'<button class="ref" data-go="worktree"><span class="reficon">'+(m[4].startsWith('PR')?'⑂':'◇')+'</span>'+esc(m[4])+'</button>':'')+(!thread&&reactions.has(i)?'<button class="reaction active" data-react="'+i+'" aria-label="Remove thumbs up reaction">👍 <span>1</span></button>':'')+(!thread&&list.length?'<button class="threadtoggle" data-thread="'+i+'">'+avatar(list[0],true)+list.length+' replies <small>Last reply '+list[list.length-1][2]+'</small></button>':'')+(!thread&&threadOpen===i?'<div class="threadblock">'+list.map((r,j)=>message(r,i*100+j,false,true)).join('')+composer(i)+'</div>':'')+'</div>'+(!thread?'<div class="msgactions" role="group" aria-label="Message actions"><button data-react="'+i+'" aria-label="'+(reactions.has(i)?'Remove':'Add')+' thumbs up reaction">'+icon('smile')+'</button><button data-thread="'+i+'" aria-label="Reply to '+esc(m[0])+'">'+icon('reply')+'</button><button data-more="'+i+'" aria-label="More actions for '+esc(m[0])+'">'+icon('more')+'</button></div>':'')+(!thread&&menuOpen===i?'<div class="msgmenu"><button data-mark-unread="'+i+'">Mark unread</button>'+(m[0]==='Jono'?'<button data-edit="'+i+'">Edit message</button>':'')+'</div>':'')+'</article>'}
function messages(){const selected=msgs.map((m,i)=>({m,i})).filter(({m})=>!query||m.join(' ').toLowerCase().includes(query.toLowerCase()));if(!selected.length)return '<div class="emptychannel">No messages match “'+esc(query)+'”.<br>Try another name or phrase.</div>';return '<div class="day">Today, October 9</div>'+selected.map(({m,i},k)=>((!query&&i===unreadStart)?'<div class="unreadline">New messages</div>':'')+message(m,i,k>0&&selected[k-1].m[0]===m[0]&&selected[k-1].m[1]===m[1]&&!query&&i!==unreadStart)).join('')}
function composer(thread=null){const text=thread===null?draft:threadDrafts[thread]||'';return '<div class="composer" data-compose="'+(thread===null?'main':thread)+'"><textarea aria-label="'+(thread===null?'Message the project':'Reply in thread')+'" placeholder="'+(thread===null?'Message #project':'Reply…')+'" rows="2">'+esc(text)+'</textarea><div class="composerfoot"><div class="composeactions"><button data-insert="@" title="Mention someone" aria-label="Insert a mention">@</button><button data-insert="`" title="Inline code" aria-label="Insert inline code">'+('<span class="mono" style="font-size:12px">&lt;/&gt;</span>')+'</button></div><span class="grow"></span><span class="composerhint">Enter to send · Shift Enter for a new line</span><button class="send" '+(!text.trim()?'disabled':'')+' aria-label="'+(thread===null?'Send':'Send reply')+'" title="Send">'+icon('send')+'</button></div></div>'}
function channel(){return '<div class="channelhead"><button class="channelname" id="channelabout" aria-expanded="'+aboutOpen+'"><span class="hash">#</span>project</button><span class="grow"></span><div class="channeltools"><button id="members" title="Channel members" aria-label="Show channel members">'+icon('people')+'</button><button id="search" title="Search messages · ⌘ F" aria-label="Search messages">'+icon('search')+'</button>'+(screen!=='channel'?'<button data-go="channel" title="Open full channel" aria-label="Open project channel">'+icon('expand')+'</button>':'')+'</div></div>'+(aboutOpen?'<div class="channelabout"><strong>Project conversation</strong><br>Jono · Implementation · Review · Sidebar polish · Restore · Point Guard<br><span>Useful updates, questions, and decisions across worktrees.</span></div>':'')+(searchOpen?'<div class="searchbox"><input aria-label="Search project messages" placeholder="Search messages…" value="'+esc(query)+'"><span id="searchcount">'+(query?msgs.filter(m=>m.join(' ').toLowerCase().includes(query.toLowerCase())).length+' results':'')+'</span><button id="closesearch" aria-label="Close search">'+icon('close')+'</button></div>':'')+(!query&&unreadStart!==null?'<div class="unreadbar"><button id="jumpunread">'+(msgs.length-unreadStart)+' unread messages ↓</button><button id="markread" aria-label="Mark all messages read">'+icon('close')+'</button></div>':'')+'<div class="messages" aria-label="Project messages" role="log" aria-live="polite" aria-relevant="additions">'+messages()+'</div><button class="jump-latest hidden" id="jumplatest">↓ Jump to latest</button>'+composer()}
function channelScreen(){return '<header class="titlebar"><button data-go="project" aria-label="Back to project">‹</button><strong>purepoint</strong><span class="muted">/ Project channel</span></header><div class="body full"><section class="channel">'+channel()+'</section></div>'}
function refreshChannel(){const c=$('.body>.channel')||$('.body.full .channel');if(!c)return;const scroll=c.querySelector('.messages')?.scrollTop||0;c.innerHTML=channel();channelWire();wireLinks();c.querySelector('.messages').scrollTop=scroll;const side=$('.sidebar [data-go="channel"]');let badge=side.querySelector('.unreadcount');if(unreadStart===null){badge?.remove()}else{if(!badge){badge=document.createElement('span');badge.className='unreadcount';side.append(badge)}badge.textContent=msgs.length-unreadStart}}
function wireLinks(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{screen=b.dataset.go;menuOpen=null;render()})}
function channelWire(){const c=$('.body>.channel')||$('.body.full .channel');if(!c)return;const log=c.querySelector('.messages');const latest=$('#jumplatest');function scrollEnd(){log.scrollTop=log.scrollHeight;latest.classList.add('hidden')}log.onscroll=()=>latest.classList.toggle('hidden',log.scrollHeight-log.scrollTop-log.clientHeight<70);latest.onclick=scrollEnd;
$('#channelabout').onclick=$('#members').onclick=()=>{aboutOpen=!aboutOpen;refreshChannel()};$('#search').onclick=()=>{searchOpen=!searchOpen;query='';refreshChannel();if(searchOpen)c.querySelector('.searchbox input').focus()};if($('#closesearch'))$('#closesearch').onclick=()=>{searchOpen=false;query='';refreshChannel()};const find=c.querySelector('.searchbox input');if(find){find.oninput=()=>{query=find.value;const unread=c.querySelector('.unreadbar');if(unread)unread.classList.toggle('hidden',!!query);log.innerHTML=messages();$('#searchcount').textContent=query?msgs.filter(m=>m.join(' ').toLowerCase().includes(query.toLowerCase())).length+' results':'';wireMessageActions();wireLinks()};find.onkeydown=e=>{if(e.key==='Escape'){$('#closesearch').click()}}}
if($('#markread'))$('#markread').onclick=()=>{unreadStart=null;refreshChannel()};if($('#jumpunread'))$('#jumpunread').onclick=()=>{const target=log.querySelector('[data-unread]');if(target)log.scrollTop=target.offsetTop-20};
function wireMessageActions(){c.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>{const i=+b.dataset.react;reactions.has(i)?reactions.delete(i):reactions.add(i);menuOpen=null;refreshChannel()});c.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{const i=+b.dataset.thread;threadOpen=threadOpen===i?null:i;menuOpen=null;refreshChannel();if(threadOpen!==null)c.querySelector('[data-compose="'+i+'"] textarea').focus()});c.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{menuOpen=menuOpen===+b.dataset.more?null:+b.dataset.more;refreshChannel()});c.querySelectorAll('[data-mark-unread]').forEach(b=>b.onclick=()=>{unreadStart=+b.dataset.markUnread;menuOpen=null;refreshChannel()});c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=+b.dataset.edit;menuOpen=null;refreshChannel();c.querySelector('.editing textarea').focus()});c.querySelectorAll('[data-cancel-edit]').forEach(b=>b.onclick=()=>{editing=null;refreshChannel()});c.querySelectorAll('[data-save-edit]').forEach(b=>b.onclick=()=>{const t=c.querySelector('.editing textarea').value.trim();if(!t)return;msgs[+b.dataset.saveEdit][3]=t;edited.add(+b.dataset.saveEdit);editing=null;refreshChannel()});wireComposers()}
function wireComposers(){c.querySelectorAll('.composer').forEach(box=>{const t=box.querySelector('textarea'),b=box.querySelector('.send'),key=box.dataset.compose;function remember(){if(key==='main')draft=t.value;else threadDrafts[key]=t.value;b.disabled=!t.value.trim();t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'}let mentionIndex=0,mentionOptions=[];const people=[['Jono','Jono','You'],['Implementation','Implementation','Agent'],['Review','Review','Agent'],['Sidebar polish','Sidebar','Agent'],['Point Guard','PointGuard','Agent']];function closeMentions(){box.querySelector('.mentionpicker')?.remove();mentionOptions=[]}function chooseMention(person){const before=t.value.slice(0,t.selectionStart),match=before.match(/(?:^|\s)@([\w-]*)$/);if(!match)return;const start=t.selectionStart-match[1].length-1;t.setRangeText('@'+person[1]+' ',start,t.selectionStart,'end');remember();closeMentions();t.focus()}function showMentions(){const before=t.value.slice(0,t.selectionStart),match=before.match(/(?:^|\s)@([\w-]*)$/);closeMentions();if(!match)return;mentionOptions=people.filter(p=>p[0].toLowerCase().includes(match[1].toLowerCase()));if(!mentionOptions.length)return;mentionIndex=0;const popup=document.createElement('div');popup.className='mentionpicker';popup.setAttribute('role','listbox');popup.setAttribute('aria-label','Mention someone');popup.innerHTML=mentionOptions.map((p,i)=>'<button type="button" role="option" data-mention="'+i+'" class="'+(i===0?'chosen':'')+'">'+esc(p[0])+'<small>'+p[2]+'</small></button>').join('');box.append(popup);popup.querySelectorAll('[data-mention]').forEach(b=>b.onclick=()=>chooseMention(mentionOptions[+b.dataset.mention]))}t.oninput=()=>{remember();showMentions()};box.querySelectorAll('[data-insert]').forEach(x=>x.onclick=()=>{const start=t.selectionStart,end=t.selectionEnd,value=x.dataset.insert;const insert=value==='`'?'`'+t.value.slice(start,end)+'`':'@';t.setRangeText(insert,start,end,'end');remember();showMentions();t.focus()});b.onclick=()=>{if(!t.value.trim())return;const value=t.value.trim();if(key==='main'){msgs.push(['Jono','','now',value,'']);draft='';unreadStart=null}else{(replies[key]||=([])).push(['Jono','','now',value,'']);threadDrafts[key]=''}query='';refreshChannel();if(key==='main'){const newlog=c.querySelector('.messages');newlog.scrollTop=newlog.scrollHeight;c.querySelector('[data-compose="main"] textarea').focus()}else c.querySelector('[data-compose="'+key+'"] textarea').focus()};t.onkeydown=e=>{if(mentionOptions.length){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();mentionIndex=(mentionIndex+(e.key==='ArrowDown'?1:-1)+mentionOptions.length)%mentionOptions.length;box.querySelectorAll('[data-mention]').forEach((b,i)=>b.classList.toggle('chosen',i===mentionIndex));return}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chooseMention(mentionOptions[mentionIndex]);return}if(e.key==='Escape'){e.preventDefault();closeMentions();return}}if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();b.click()}}})}
wireMessageActions();}
function wire(){baseWire();channelWire();wireLinks();document.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'&&$('.channel')){e.preventDefault();searchOpen=true;refreshChannel();$('.searchbox input').focus()}if(e.key==='Escape'&&menuOpen!==null){menuOpen=null;refreshChannel()}}}


render();
window.prototypeState=(state)=>{if(state==='empty'){$('.messages').innerHTML='<div class="empty">No messages yet.<br>Share something useful with the project.</div>'}if(state==='error'){const e=document.createElement('div');e.className='error';e.innerHTML='Channel unavailable. Showing saved messages.<button>Retry</button>';$('.detail').prepend(e);e.querySelector('button').onclick=()=>e.remove()}if(state==='loading'){$('.messages').innerHTML='<div class="empty" role="status">Loading project messages…</div>'}if(state==='clean'){tab='uncommitted';screen='worktree';render();document.querySelector('[data-tab="uncommitted"]').textContent='Uncommitted · 0';$('#diffcontent').innerHTML='<div class="empty">No uncommitted changes.<br>4 commits are available in Branch changes and Commits.</div>'}};
})();

</script>
